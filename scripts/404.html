<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060b08">
<meta name="robots" content="noindex">
<title>Page not found · The Substitute</title>
<link rel="icon" href="{{BASE}}assets/favicon.svg" type="image/svg+xml">
<!-- The page GitHub Pages shows for an address that isn't part of the game (written into the
     build by scripts/build-site.mjs, which fills in {{BASE}}, the site's root). It is drawn like
     the game's own screens: a chalkboard-green glass card, with the same colours and fonts. -->
<style>
  @font-face { font-family: 'Fredoka'; src: url('{{BASE}}assets/fonts/fredoka.woff2') format('woff2'); font-weight: 300 700; font-display: swap; }
  @font-face { font-family: 'Nunito'; src: url('{{BASE}}assets/fonts/nunito.woff2') format('woff2'); font-weight: 200 1000; font-display: swap; }
  :root {
    --ink: #0e1612;
    --night: #060b08;
    --board: #12241a;
    --board-raise: #1b3427;
    --board-hi: #28493a;
    --chalk: #f6f1e4;
    --chalk-dim: #cdd2bf;
    --pencil-yellow: #f2b93b;
    --pencil-yellow-bright: #ffd573;
    --pencil-yellow-deep: #8f5f08;
    --notebook-blue-bright: #8cc6ee;
    --shadow: #000;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
    background: radial-gradient(ellipse at 50% 35%, var(--board-raise), var(--night) 70%); color: var(--chalk); font-family: 'Nunito', system-ui, sans-serif;
  }
  .card {
    width: min(100%, 520px); padding: 32px 24px; border-radius: 24px; text-align: center;
    background: linear-gradient(180deg, var(--board-raise), var(--board));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--chalk) 16%, transparent), 0 30px 80px color-mix(in srgb, var(--shadow) 60%, transparent);
  }
  .apple {
    display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; margin: 0 auto 8px; font-size: 30px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--board-hi), var(--board));
    box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--chalk) 24%, transparent);
  }
  .kicker { font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; font-size: 12px; color: var(--pencil-yellow); }
  h1 { font-family: 'Fredoka', system-ui, sans-serif; font-weight: 700; font-size: clamp(26px, 6vw, 34px); line-height: 1.1; margin: 4px 0 8px; text-wrap: balance; }
  p { font-size: 16px; line-height: 1.55; color: var(--chalk-dim); margin: 0 auto 24px; max-width: 40ch; }
  .btn {
    display: inline-block; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 16px; color: var(--ink); text-decoration: none;
    background: linear-gradient(180deg, var(--pencil-yellow-bright), var(--pencil-yellow)); border-radius: 999px; padding: 12px 32px; min-height: 44px;
    box-shadow: 0 4px 0 var(--pencil-yellow-deep), 0 10px 24px color-mix(in srgb, var(--pencil-yellow) 28%, transparent);
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:focus-visible, .other a:focus-visible { outline: 3px solid var(--pencil-yellow); outline-offset: 2px; }
  .other { list-style: none; margin: 28px 0 0; padding: 16px 0 0; border-top: 1px solid color-mix(in srgb, var(--chalk) 16%, transparent); display: grid; gap: 8px; font-size: 14px; color: var(--chalk-dim); }
  .other a { color: var(--notebook-blue-bright); font-weight: 700; }
</style>
</head>
<body>
<main class="card">
  <span class="apple" aria-hidden="true">🍎</span>
  <div class="kicker">The Substitute · 404</div>
  <h1>This page isn’t on the timetable</h1>
  <p>There’s nothing at this address. Room 204 is this way, and the class is waiting.</p>
  <a class="btn" id="home" href="{{BASE}}">Back to the classroom ▸</a>
  <ul class="other">
    <li lang="es">Esta página no está en el horario. <a href="{{BASE}}">Volver al aula</a></li>
    <li lang="fr">Cette page n’est pas à l’emploi du temps. <a href="{{BASE}}">Retour en classe</a></li>
  </ul>
</main>
</body>
</html>
