name: Deploy to GitHub Pages

# Publishes the game to https://thomaswright03.github.io/the-substitute-game/ on every push to
# main, after the full test suite passes. Pages must be switched on once in the repository's
# settings (Settings > Pages > Build and deployment > Source: GitHub Actions); see README.md.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push waits rather than cancelling one in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      # the site's path on Pages (/the-substitute-game), which the 404 page links back to
      - run: npm run build -- --base "${{ steps.pages.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
